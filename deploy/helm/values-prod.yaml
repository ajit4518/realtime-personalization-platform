# Production overrides.

replicaCount: 8

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/recommendations
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/streaming-prod-recommendations

model:
  bucket: streaming-prod-models

resources:
  requests:
    cpu: 2000m
    memory: 3Gi
  limits:
    cpu: 4000m

autoscaling:
  enabled: true
  minReplicas: 8
  maxReplicas: 60
  targetCPUUtilization: 60
  targetRequestsPerPod: "250"

tuning:
  featureTimeoutSeconds: "0.015"
  redisPoolSize: "48"
  maxPerGenre: "3"
  logLevel: INFO

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30

canary:
  enabled: false   # enabled explicitly by the CD workflow for the canary release
  weight: 5
  replicaCount: 2
